# Static preview of the app for trying it on a phone without the home server.
# Preview builds have sync turned off: all data stays on the device.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Preview (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build preview
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_PREVIEW: '1'
        run: |
          npm ci
          npx vite build
          # Deep links before the service worker is installed fall back to the app
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
